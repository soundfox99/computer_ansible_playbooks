---
- name: Install GTK/Qt themes + theming tools
  become: false
  kewlfft.aur.aur:
    name:
      - catppuccin-gtk-theme-mocha
      - tokyonight-gtk-theme-git
      - bibata-cursor-theme
      - nwg-look
      - qt5ct
      - qt6ct
    use: yay
    state: present

